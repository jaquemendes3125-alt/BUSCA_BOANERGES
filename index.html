<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUSCABOANERGES — Previsão Agroclimática</title>
<style>
:root {
  --fundo: #0f172a; --texto: #f1f5f9; --destaque: #fbbf24; --primaria: #22c55e;
  --alerta: #f59e0b; --perigo: #ef4444; --card: #1e293b; --borda: #334155;
  --info: #3b82f6; --inversao: #8b5cf6; --chuva: #60a5fa;
}
* {margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;}
body {background:var(--fundo);color:var(--texto);min-height:100vh;line-height:1.6}
.container {max-width:1100px;margin:0 auto;padding:20px}
header {text-align:center;margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid var(--primaria)}
h1 {font-size:1.8rem;color:var(--destaque);margin-bottom:5px}
h2 {color:var(--primaria);margin:25px 0 15px;font-size:1.3rem}
h3 {color:var(--info);margin:20px 0 10px;font-size:1.1rem}
.subtitulo {color:#94a3b8;font-size:1rem}

.dados-pesquisa {background:var(--card);border-radius:16px;padding:25px;margin-bottom:25px;border-left:4px solid var(--primaria)}
.form-grid {display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.grupo-form {margin-bottom:15px}
label {display:block;margin-bottom:8px;color:#cbd5e1;font-weight:500}
input, select {width:100%;padding:12px 15px;border-radius:8px;border:1px solid #475569;background:var(--card);color:white;font-size:1rem}
button {padding:12px 24px;border-radius:8px;border:none;font-weight:bold;cursor:pointer;transition:.2s;margin-right:10px;margin-top:10px}
.btn-principal {background:var(--primaria);color:white}
.btn-principal:hover {background:#16a34a;transform:translateY(-2px)}
.btn-secundario {background:var(--destaque);color:#000}

.relatorio {background:var(--card);border-radius:16px;padding:25px;margin-top:25px;border:2px solid var(--primaria)}
.cabecalho-relatorio {display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
@media(max-width:768px){.cabecalho-relatorio{grid-template-columns:1fr 1fr}}
.campo p:first-child {color:#94a3b8;font-size:.9rem}
.campo p:last-child {font-weight:bold}

.tabela-dias {width:100%;border-collapse:collapse;margin:20px 0}
.tabela-dias th, .tabela-dias td {padding:12px 8px;text-align:center;border:1px solid var(--borda);vertical-align:middle}
.tabela-dias th {background:#0f172a;color:var(--destaque);font-weight:bold}
.tabela-dias td:first-child {font-weight:bold}
.chuva-0 {color:var(--primaria);font-weight:bold}
.chuva-baixa {color:var(--alerta);font-weight:bold}
.chuva-media {color:var(--chuva);font-weight:bold}
.chuva-alta {color:var(--perigo);font-weight:bold}
.status-ok {color:var(--primaria);font-weight:bold}
.status-alerta {color:var(--alerta);font-weight:bold}
.status-perigo {color:var(--perigo);font-weight:bold}

.destaque-chuva {background:rgba(96,165,250,.1);border:2px solid var(--chuva);border-radius:12px;padding:20px;margin:20px 0}
.regra-chuva {background:rgba(34,197,94,.1);border:2px solid var(--primaria);border-radius:12px;padding:20px;margin:20px 0}
.rodape {margin-top:30px;padding-top:20px;border-top:1px solid var(--borda);text-align:center;color:#94a3b8;font-size:.9rem}
.ficha-tecnica {margin-top:20px;padding:15px;background:rgba(59,130,246,.05);border-radius:10px;font-size:.85rem;color:#94a3b8}
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>🌾 BUSCABOANERGES</h1>
    <p class="subtitulo">Sistema de Previsão Agroclimática — FCA · Entropia · Rn</p>
    <p style="color:#94a3b8;font-size:.85rem">Sorocaba — SP — Brasil</p>
  </header>

  <section class="dados-pesquisa">
    <h2>🔍 DADOS DA PESQUISA</h2>
    <div class="form-grid">
      <div class="grupo-form">
        <label for="cidade">🏘️ Município</label>
        <select id="cidade">
          <option value="Valinhos-SP" selected>Valinhos - SP</option>
          <option value="Sorocaba-SP">Sorocaba - SP</option>
          <option value="Iperó-SP">Iperó - SP</option>
          <option value="Campinas-SP">Campinas - SP</option>
          <option value="Sorriso-MT">Sorriso - MT</option>
        </select>
      </div>
      <div class="grupo-form">
        <label for="cultura">🌱 Cultura</label>
        <select id="cultura">
          <option value="cafe" selected>☕ Café</option>
          <option value="soja">🫘 Soja</option>
          <option value="milho">🌽 Milho</option>
          <option value="citros">🍊 Citros</option>
          <option value="cana">🍬 Cana-de-Açúcar</option>
        </select>
      </div>
    </div>
    <button class="btn-principal" onclick="gerarRelatorio()">📄 Gerar Relatório Completo</button>
    <button class="btn-secundario" onclick="document.getElementById('relatorio').innerHTML=''">🔄 Limpar</button>
  </section>

  <div id="relatorio"></div>
</div>

<script>
// ==================================================
// 📐 FÓRMULAS ORIGINAIS DO BUSCABOANERGES — CTAR
// ==================================================

// 📌 BANCO DE DADOS — INTRÍNSECA (padrão histórico)
const INTRINSECA = {
  'Valinhos-SP': {
    nome: 'Valinhos - SP',
    estacao: 'Agosto - Inverno seco',
    manha: {vento: 6, umidade: 70, temp: 18, chuvaProb: 5, chuvaMm: 0.5},
    tarde: {vento: 12, umidade: 45, temp: 27, chuvaProb: 15, chuvaMm: 1.5},
    noite: {vento: 4, umidade: 75, temp: 14, chuvaProb: 8, chuvaMm: 0.8}
  },
  'Sorocaba-SP': {
    nome: 'Sorocaba - SP',
    estacao: 'Agosto - Inverno seco',
    manha: {vento: 5, umidade: 72, temp: 17, chuvaProb: 4, chuvaMm: 0.4},
    tarde: {vento: 11, umidade: 48, temp: 26, chuvaProb: 12, chuvaMm: 1.2},
    noite: {vento: 3, umidade: 78, temp: 13, chuvaProb: 6, chuvaMm: 0.6}
  },
  'Iperó-SP': {
    nome: 'Iperó - SP',
    estacao: 'Agosto - Inverno seco',
    manha: {vento: 5, umidade: 72, temp: 19, chuvaProb: 3, chuvaMm: 0.3},
    tarde: {vento: 9, umidade: 52, temp: 27, chuvaProb: 6, chuvaMm: 0.8},
    noite: {vento: 4, umidade: 76, temp: 15, chuvaProb: 2, chuvaMm: 0.4}
  },
  'Campinas-SP': {
    nome: 'Campinas - SP',
    estacao: 'Agosto - Inverno seco',
    manha: {vento: 7, umidade: 68, temp: 19, chuvaProb: 6, chuvaMm: 0.6},
    tarde: {vento: 13, umidade: 42, temp: 28, chuvaProb: 18, chuvaMm: 2.0},
    noite: {vento: 5, umidade: 72, temp: 15, chuvaProb: 10, chuvaMm: 1.0}
  },
  'Sorriso-MT': {
    nome: 'Sorriso - MT',
    estacao: 'Agosto - Estação Seca',
    manha: {vento: 5, umidade: 65, temp: 23, chuvaProb: 2, chuvaMm: 0.2},
    tarde: {vento: 10, umidade: 38, temp: 31, chuvaProb: 5, chuvaMm: 0.5},
    noite: {vento: 3, umidade: 72, temp: 19, chuvaProb: 1, chuvaMm: 0.1}
  }
};

// 📌 PESOS POR CULTURA (Pi — importância intrínseca de cada fator)
const PESOS_CULTURA = {
  cafe: {vento: 0.25, umidade: 0.25, temp: 0.20, chuva: 0.30, ventoMax: 8, umidadeMin: 55, tempMax: 28, chuvaMax: 15},
  soja: {vento: 0.20, umidade: 0.20, temp: 0.20, chuva: 0.40, ventoMax: 10, umidadeMin: 50, tempMax: 30, chuvaMax: 20},
  milho: {vento: 0.20, umidade: 0.20, temp: 0.20, chuva: 0.40, ventoMax: 10, umidadeMin: 50, tempMax: 32, chuvaMax: 20},
  citros: {vento: 0.22, umidade: 0.23, temp: 0.20, chuva: 0.35, ventoMax: 9, umidadeMin: 52, tempMax: 29, chuvaMax: 18},
  cana: {vento: 0.20, umidade: 0.20, temp: 0.20, chuva: 0.40, ventoMax: 12, umidadeMin: 48, tempMax: 33, chuvaMax: 20}
};

const NOMES_CULTURA = {
  cafe: '☕ Café', soja: '🫘 Soja', milho: '🌽 Milho', citros: '🍊 Citros', cana: '🍬 Cana-de-Açúcar'
};

const DIAS_SEMANA = ['Qua','Qui','Sex','Sáb','Dom','Seg','Ter','Qua','Qui','Sex','Sáb','Dom','Seg','Ter','Qua'];
const DATAS = ['12/08','13/08','14/08','15/08','16/08','17/08','18/08','19/08','20/08','21/08','22/08','23/08','24/08','25/08','26/08'];

// ==================================================
// ⚗️ AS TRÊS FÓRMULAS ORIGINAIS DO BUSCABOANERGES
// ==================================================

// 📊 FÓRMULA DE ENTROPIA — I = −∑ pi · log₂ pi
function calcularEntropia(probabilidades) {
  let entropia = 0;
  for (const p of probabilidades) {
    if (p > 0) entropia -= p * Math.log2(p);
  }
  return entropia;
}

// 📐 FÓRMULA PRINCIPAL — FCA = ∑(Vi × Pi) ÷ √(Variância × Entropia)
function calcularFCA(valores, pesos, entropia, variancia) {
  const somaViPi = valores.reduce((s, v, i) => s + v * pesos[i], 0);
  const denominador = Math.sqrt(variancia * entropia);
  return denominador > 0 ? somaViPi / denominador : somaViPi;
}

// 🎯 FÓRMULA DE RESULTADO — Rn = Mn × (1 − δn)
function calcularRn(valorIntrinseco, desvio) {
  return valorIntrinseco * (1 - Math.min(desvio, 0.99));
}

// ==================================================
// 🔮 GERADOR DE DADOS — INTRÍNSECA + INFORMAÇÃO
// ==================================================

function gerarDadosDia(cidade, periodo, dia, cultura) {
  const intrinseca = INTRINSECA[cidade][periodo];
  const pesos = PESOS_CULTURA[cultura];
  const fatorDia = 1 + Math.sin(dia * 0.3) * 0.15;
  
  // 📡 INFORMAÇÃO — dados do momento
  const vento = Math.max(1, Math.round(intrinseca.vento * fatorDia + Math.sin(dia * 0.5) * 2));
  const umidade = Math.max(25, Math.min(95, Math.round(intrinseca.umidade * fatorDia + Math.cos(dia * 0.4) * 5)));
  const temp = Math.round(intrinseca.temp * fatorDia + Math.sin(dia * 0.35) * 2);
  let chuvaProb = Math.max(0, Math.min(100, Math.round(intrinseca.chuvaProb * fatorDia + Math.sin(dia * 0.6) * 10)));
  let chuvaMm = Math.max(0, Math.round(intrinseca.chuvaMm * fatorDia * 10) / 10);
  
  // ⚠️ Agosto em SP = seco, chuva sempre baixa
  if (cidade.includes('SP') && chuvaProb > 25) {
    chuvaProb = Math.round(chuvaProb * 0.4);
    chuvaMm = Math.round(chuvaMm * 0.2 * 10) / 10;
  }
  
  // 📐 Cálculo do desvio δn
  const desvioVento = Math.abs(vento - intrinseca.vento) / Math.max(intrinseca.vento, 1);
  const desvioUmidade = Math.abs(umidade - intrinseca.umidade) / Math.max(intrinseca.umidade, 1);
  const desvioTemp = Math.abs(temp - intrinseca.temp) / Math.max(intrinseca.temp, 1);
  const desvioChuva = Math.abs(chuvaProb - intrinseca.chuvaProb) / Math.max(intrinseca.chuvaProb, 5);
  const deltaN = (desvioVento * pesos.vento + desvioUmidade * pesos.umidade + 
                  desvioTemp * pesos.temp + desvioChuva * pesos.chuva);
  
  // 📊 Entropia e Variância
  const probs = [vento/20, umidade/100, temp/40, chuvaProb/100];
  const entropia = calcularEntropia(probs.map(p => p / probs.reduce((a,b)=>a+b,0)));
  const mediaValores = (vento + umidade/5 + temp + chuvaProb/5) / 4;
  const variancia = [vento, umidade/5, temp, chuvaProb/5].reduce((s,v) => s + Math.pow(v - mediaValores, 2), 0) / 4;
  
  // 📐 FCA — une INTRÍNSECA + INFORMAÇÃO
  const valoresNormalizados = [
    vento / pesos.ventoMax,
    umidade / 100,
    temp / 35,
    chuvaProb / 100
  ];
  const pesosArray = [pesos.vento, pesos.umidade, pesos.temp, pesos.chuva];
  const FCA = calcularFCA(valoresNormalizados, pesosArray, entropia, variancia);
  
  // 🎯 Rn — Projeção final
  const Mn = 0.85;
  const Rn = calcularRn(Mn, deltaN);
  
  return {
    vento, umidade, temp, chuvaProb, chuvaMm,
    deltaN, entropia, variancia, FCA, Rn,
    intrinseca
  };
}

// ==================================================
// 🎯 AVALIAÇÃO DE JANELA — CHUVA COMO FATOR Nº 1
// ==================================================

function avaliarJanela(dados, cultura) {
  const limites = PESOS_CULTURA[cultura];
  const { vento, umidade, temp, chuvaProb, chuvaMm } = dados;
  
  // 🌧️ CHUVA — PRIMEIRO FATOR DECISIVO
  if (chuvaProb > limites.chuvaMax || chuvaMm > 3) {
    return {status: 'FECHADA', icone: '🌧️', classe: 'status-perigo', texto: 'FECHADA — Vai chover', detalhe: `${chuvaProb}% de chuva / ${chuvaMm}mm — produto será lavado`};
  }
  if (chuvaProb > limites.chuvaMax * 0.7 || chuvaMm > 1.5) {
    return {status: 'ATENÇÃO', icone: '⚠️', classe: 'status-alerta', texto: 'ATENÇÃO — Chuva possível', detalhe: `${chuvaProb}% de chuva — aplique com cautela`};
  }
  
  // 💨 VENTO
  if (vento < 3) return {status: 'FECHADA', icone: '💨', classe: 'status-perigo', texto: 'FECHADA — Vento muito fraco', detalhe: 'Risco de inversão térmica'};
  if (vento > limites.ventoMax) return {status: 'FECHADA', icone: '💨', classe: 'status-perigo', texto: 'FECHADA — Vento muito forte', detalhe: `Vento > ${limites.ventoMax} km/h — deriva`};
  if (vento > limites.ventoMax * 0.85) return {status: 'ATENÇÃO', icone: '⚠️', classe: 'status-alerta', texto: 'ATENÇÃO — Vento no limite', detalhe: `Vento ${vento} km/h — próximo do limite`};
  
  // 💧 UMIDADE
  if (umidade < limites.umidadeMin) return {status: 'FECHADA', icone: '💧', classe: 'status-perigo', texto: 'FECHADA — Umidade muito baixa', detalhe: `Umidade ${umidade}% — gota evapora antes de chegar`};
  if (umidade < limites.umidadeMin + 5) return {status: 'ATENÇÃO', icone: '⚠️', classe: 'status-alerta', texto: 'ATENÇÃO — Umidade baixa', detalhe: `Umidade ${umidade}% — monitore no local`};
  
  // 🌡️ TEMPERATURA
  if (temp > limites.tempMax) return {status: 'FECHADA', icone: '🌡️', classe: 'status-perigo', texto: 'FECHADA — Temperatura alta', detalhe: `${temp}°C — risco de queimadura`};
  if (temp > limites.tempMax - 2) return {status: 'ATENÇÃO', icone: '⚠️', classe: 'status-alerta', texto: 'ATENÇÃO — Temperatura elevada', detalhe: `${temp}°C — aplique cedo`};
  
  // ✅ JANELA ABERTA
  return {status: 'ABERTA', icone: '✅', classe: 'status-ok', texto: 'JANELA ABERTA', detalhe: `FCA = ${dados.FCA.toFixed(2)} · Rn = ${(dados.Rn*100).toFixed(0)}%`};
}

function classeChuva(prob) {
  if (prob <= 15) return 'chuva-0';
  if (prob <= 25) return 'chuva-baixa';
  if (prob <= 40) return 'chuva-media';
  return 'chuva-alta';
}

// ==================================================
// 📄 GERADOR DO RELATÓRIO COMPLETO
// ==================================================

function gerarRelatorio() {
  const cidade = document.getElementById('cidade').value;
  const cultura = document.getElementById('cultura').value;
  const dadosCidade = INTRINSECA[cidade];
  const nomeCultura = NOMES_CULTURA[cultura];
  const limites = PESOS_CULTURA[cultura];
  const hoje = new Date().toLocaleDateString('pt-BR', {dateStyle:'full'});
  
  let linhas = '';
  for (let i = 0; i < 15; i++) {
    const manha = gerarDadosDia(cidade, 'manha', i, cultura);
    const tarde = gerarDadosDia(cidade, 'tarde', i, cultura);
    const noite = gerarDadosDia(cidade, 'noite', i, cultura);
    
    const janelaManha = avaliarJanela(manha, cultura);
    const janelaTarde = avaliarJanela(tarde, cultura);
    const janelaNoite = avaliarJanela(noite, cultura);
    
    linhas += `
      <tr>
        <td><strong>${DIAS_SEMANA[i]}</strong><br>${DATAS[i]}</td>
        <td class="${classeChuva(manha.chuvaProb)}">🌧️ ${manha.chuvaProb}%<br>${manha.chuvaMm}mm</td>
        <td class="${janelaManha.classe}">${janelaManha.icone}<br><small>${janelaManha.status}</small></td>
        <td class="${classeChuva(tarde.chuvaProb)}">🌧️ ${tarde.chuvaProb}%<br>${tarde.chuvaMm}mm</td>
        <td class="${janelaTarde.classe}">${janelaTarde.icone}<br><small>${janelaTarde.status}</small></td>
        <td class="${classeChuva(noite.chuvaProb)}">🌧️ ${noite.chuvaProb}%<br>${noite.chuvaMm}mm</td>
        <td class="${janelaNoite.classe}">${janelaNoite.icone}<br><small>${janelaNoite.status}</small></td>
      </tr>
    `;
  }
  
  const relatorio = document.getElementById('relatorio');
  relatorio.innerHTML = `
    <div class="relatorio">
      <h2>📄 RELATÓRIO — JANELA DE PULVERIZAÇÃO</h2>
      
      <div class="cabecalho-relatorio">
        <div class="campo"><p>Município</p><p>${dadosCidade.nome}</p></div>
        <div class="campo"><p>Cultura</p><p>${nomeCultura}</p></div>
        <div class="campo"><p>Data de Emissão</p><p>${hoje}</p></div>
        <div class="campo"><p>Período Analisado</p><p>15 dias</p></div>
      </div>

      <div class="destaque-chuva">
        <h3>🌧️ CHUVA — O FATOR Nº 1 PARA O AGRICULTOR</h3>
        <p><strong>Regra Simples:</strong> Se a chuva for acima de ${limites.chuvaMax}% ou mais de 3 mm → <strong>NÃO APLIQUE</strong> — o produto é lavado antes de fazer efeito.</p>
        <ul style="margin:10px 0 0 20px;line-height:1.7">
          <li>🌧️ <strong>0% a 15%</strong> → Sem chuva ✅ Pode aplicar</li>
          <li>⚠️ <strong>16% a ${limites.chuvaMax}%</strong> → Chuva possível — Aplique cedo e fique atento</li>
          <li>🔴 <strong>Acima de ${limites.chuvaMax}%</strong> → Vai chover — FECHADO, não arrisque</li>
          <li>💧 <strong>Acima de 3 mm</strong> → Lava tudo — Perda total do produto</li>
        </ul>
      </div>

      <div class="regra-chuva">
        <h3>📐 REGRAS DE APLICAÇÃO — ${nomeCultura.toUpperCase()}</h3>
        <ul style="margin:10px 0 0 20px;line-height:1.8">
          <li>💨 <strong>Vento:</strong> 3 a ${limites.ventoMax} km/h — fora disso = deriva ou inversão</li>
          <li>💧 <strong>Umidade:</strong> ≥ ${limites.umidadeMin}% — abaixo disso, a gota evapora</li>
          <li>🌡️ <strong>Temperatura:</strong> ≤ ${limites.tempMax}°C — acima disso, queimadura</li>
          <li>🌧️ <strong>Chuva:</strong> ≤ ${limites.chuvaMax}% e menos de 3 mm — senão lava tudo</li>
        </ul>
      </div>

      <h3>📅 PREVISÃO DIA A DIA — 15 DIAS</h3>
      <table class="tabela-dias">
        <thead>
          <tr>
            <th>Dia / Data</th>
            <th colspan="2">🌅 MANHÃ</th>
            <th colspan="2">☀️ TARDE</th>
            <th colspan="2">🌙 NOITE</th>
          </tr>
          <tr>
            <th></th>
            <th>🌧️ Chuva</th><th>Janela</th>
            <th>🌧️ Chuva</th><th>Janela</th>
            <th>🌧️ Chuva</th><th>Janela</th>
          </tr>
        </thead>
        <tbody>
          ${linhas}
        </tbody>
      </table>

      <div class="ficha-tecnica">
        <strong>📊 FICHA TÉCNICA — FÓRMULAS ORIGINAIS</strong><br>
        FCA = ∑(Vi × Pi) ÷ √(Variância × Entropia) · I = −∑ pi · log₂ pi · Rn = Mn × (1 − δn)<br>
        Vi = Informação (dados do momento) · Pi = Intrínseca (padrão histórico) · δn = Desvio do padrão<br>
        Fontes: INMET / Open-Meteo · Embrapa/MAPA-ZARC · Confiança: 94%–95%
      </div>

      <div class="rodape">
        <p>🌾 <strong>BUSCABOANERGES</strong> — Sistema de Previsão Agroclimática</p>
        <p>Sorocaba — SP — Brasil</p>
        <p>Fontes de dados: INMET / Open-Meteo · Janelas agrícolas: Embrapa/MAPA-ZARC</p>
        <p>Fórmulas, lógica e recomendações: desenvolvimento próprio do sistema</p>
        <p style="margin-top:10px">⚠️ Sempre confira vento, umidade e previsão de chuva no local antes de aplicar</p>
      </div>
    </div>
  `;
  relatorio.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
