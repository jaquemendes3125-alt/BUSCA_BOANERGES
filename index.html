<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaBoanerges</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#0a0f1a;color:#e2e8f0;padding:20px;line-height:1.6}
        .container{max-width:900px;margin:0 auto}
        h1{color:#d4af37;text-align:center;margin-bottom:30px}
        .acesso{background:#111827;border:1px solid #334155;border-radius:12px;padding:25px;margin-bottom:25px;text-align:center}
        input{width:100%;max-width:500px;padding:15px;font-size:1rem;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#fff;outline:none;text-align:center}
        input:focus{border-color:#d4af37}
        .instrucao{color:#94a3b8;margin-top:15px}
        .btn{background:#d4af37;color:#000;border:none;padding:12px 30px;border-radius:8px;font-weight:bold;font-size:1rem;cursor:pointer;margin-top:20px}
        .btn:hover{background:#b8860b}
        .area-pesquisa{display:none;margin-top:30px}
        .relatorio{display:none;background:#111827;border:1px solid #334155;border-radius:12px;padding:30px;margin-top:25px}
        .entrada-pesquisa{margin:20px 0}
        .entrada-pesquisa input{text-align:left;max-width:300px}
        .resultado{margin-top:20px;padding:20px;border-radius:8px}
        .I-128{border-left:4px solid #22c55e;background:rgba(34,197,94,.1)}
        .I-96{border-left:4px solid #f59e0b;background:rgba(245,158,11,.1)}
        .I-64{border-left:4px solid #3b82f6;background:rgba(59,130,246,.1)}
        .I-32{border-left:4px solid #ef4444;background:rgba(239,68,68,.1)}
        .valor-I{font-size:2.5rem;font-weight:bold;text-align:center;margin:20px 0}
        .dias-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:20px}
        .dia-card{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:12px}
    </style>
</head>
<body>
<div class="container">

    <h1>🌾 BuscaBoanerges</h1>

    <!-- ÁREA DE ACESSO — COMANDO EXATO DE ATIVAÇÃO -->
    <div class="acesso">
        <input type="text" id="codigo-acesso" placeholder="Digite o código de acesso">
        <p class="instrucao">Digite o código para acessar a área de pesquisa</p>
        <button class="btn" onclick="verificarAcesso()">ENTRAR</button>
    </div>

    <!-- ÁREA DE PESQUISA — LIBERADA SOMENTE APÓS CÓDIGO CORRETO -->
    <div id="area-pesquisa" class="area-pesquisa">
        <h2 style="color:#d4af37;margin-bottom:20px">🔍 Área de Pesquisa e Relatório</h2>
        
        <div class="entrada-pesquisa">
            <label style="font-weight:bold;display:block;margin-bottom:10px">Local / Região:</label>
            <input type="text" id="local-pesquisa" placeholder="Ex: Sorocaba">
            <button class="btn" onclick="gerarRelatorio()">GERAR RELATÓRIO</button>
        </div>

        <!-- RELATÓRIO GERADO -->
        <div id="relatorio" class="relatorio">
            <div id="conteudo-relatorio"></div>
        </div>
    </div>

</div>

<!-- ==============================================================
     🧠 CORAÇÃO DE CÁLCULO — PURO, SEM ADIÇÕES, CONFORME ORIGINAL
     ============================================================== -->
<script>
'use strict';

// ==============================================================
// 📐 FÓRMULA 1 — BOA ENERGIAS: I = 64 × O ÷ R
// 📐 FÓRMULA 2 — LINGUAGEM INTRÍNSECA: L = (PE × EC) ÷ CM
// ==============================================================

const CÓDIGO_ATIVAÇÃO = "#_area_d_relatorio_seguro";

const BANCO_DADOS = {
    "Sorocaba": { chuva:14, tempMin:13, tempMax:27, umidade:68, vento:"SE", nuvens:4, geada:0, enso:"neutro" },
    "Capinzal": { chuva:65, tempMin:8, tempMax:22, umidade:78, vento:"NO", nuvens:12, geada:6, enso:"neutro" },
    "Chapecó": { chuva:70, tempMin:10, tempMax:24, umidade:76, vento:"NO", nuvens:11, geada:4, enso:"neutro" },
    "Londrina": { chuva:45, tempMin:12, tempMax:26, umidade:72, vento:"L", nuvens:8, geada:2, enso:"neutro" },
    "Cascavel": { chuva:55, tempMin:10, tempMax:25, umidade:75, vento:"SO", nuvens:10, geada:3, enso:"neutro" },
    "Curitiba": { chuva:80, tempMin:9, tempMax:22, umidade:80, vento:"O", nuvens:14, geada:5, enso:"neutro" },
    "Goiânia": { chuva:5, tempMin:16, tempMax:30, umidade:60, vento:"NE", nuvens:2, geada:0, enso:"neutro" },
    "Uberaba": { chuva:8, tempMin:15, tempMax:29, umidade:62, vento:"L", nuvens:3, geada:0, enso:"neutro" }
};

// ==============================================================
// 🔒 VERIFICAÇÃO DE ACESSO — CÓDIGO EXATO
// ==============================================================
function verificarAcesso() {
    const entrada = document.getElementById('codigo-acesso').value.trim();
    if (entrada === CÓDIGO_ATIVAÇÃO) {
        document.getElementById('area-pesquisa').style.display = 'block';
        document.getElementById('codigo-acesso').disabled = true;
        document.querySelector('.acesso').style.opacity = '0.5';
    } else {
        alert('Código incorreto.');
    }
}

// ==============================================================
// 📊 AS 12 LEITURAS + FÓRMULAS — PURO
// ==============================================================
function executarLeituras(dados, dadosAtuais, enso) {
    // LEITURAS HISTÓRICAS → PE
    const L1 = dados.chuva;
    const L2 = (dados.tempMin + dados.tempMax) / 2;
    const L3 = dados.umidade;
    const L4 = dados.vento;
    const L5 = dados.nuvens;
    const L6 = dados.geada;

    // LEITURA DE CONTEXTO → CM
    const L7 = enso;
    const fatoresCM = { "el-nino":0.85, "la-nina":1.2, "neutro":1.0 };
    const CM = fatoresCM[L7];

    // LEITURAS ATUAIS → EC
    const L8 = dadosAtuais.temp;
    const L9 = dadosAtuais.chuva;
    const L10 = dadosAtuais.umidade;
    const L11 = dadosAtuais.vento;
    const L12 = dadosAtuais.ceu;

    // 📐 FÓRMULA 2: L = (PE × EC) ÷ CM
    const PE = (L1 + L2 + L3 + L5 + L6) / 5;
    const alinhamento = (Math.abs(L8 - L2) < 5 && Math.abs(L9 - L1) < 10 && L11 === L4) ? 90 : 65;
    const EC = alinhamento;
    const L = Math.round((PE * EC) / CM);

    // CONVERSÃO L → O e R
    let O;
    if (L >= 85) O = 4;
    else if (L >= 70) O = 3;
    else if (L >= 55) O = 2;
    else O = 1;
    const R = (L3 >= 65 && L5 >= 5) ? 2 : 1;

    // 📐 FÓRMULA 1: I = 64 × O ÷ R
    const I = Math.round((64 * O) / R);

    return { I, L, O, R, PE, EC, CM, L1, L2, L3, L5, L6 };
}

function interpretar(I) {
    const mapa = {
        128: { classe:"I-128", titulo:"✅ EQUILÍBRIO — Padrão Confirmado", texto:"O clima segue o padrão histórico. Estabilidade nos próximos dias." },
        96: { classe:"I-96", titulo:"⚠️ TENSÃO — Mudança se Aproximando", texto:"O padrão começa a se alterar. Atenção nos próximos 3 a 5 dias." },
        64: { classe:"I-64", titulo:"⚡ TRANSIÇÃO — Novo Padrão", texto:"Mudança significativa. Reavalie o planejamento." },
        32: { classe:"I-32", titulo:"🌪️ MOVIMENTO FORTE — Padrão Alterado", texto:"Evento significativo. Adie aplicações que possam ser perdidas pela chuva." }
    };
    return mapa[I] || mapa[128];
}

function gerarRelatorio() {
    const local = document.getElementById('local-pesquisa').value.trim();
    if (!BANCO_DADOS[local]) { alert('Local não encontrado.'); return; }

    const dados = BANCO_DADOS[local];
    const dadosAtuais = {
        temp: Math.round(dados.tempMin + Math.random() * 15),
        chuva: Math.round(dados.chuva * (0.3 + Math.random() * 0.7)),
        umidade: Math.round(dados.umidade + (Math.random() - 0.5) * 20),
        vento: dados.vento,
        ceu: Math.round(dados.nuvens + (Math.random() - 0.5) * 4)
    };

    const resultado = executarLeituras(dados, dadosAtuais, dados.enso);
    const interpretacao = interpretar(resultado.I);

    const conteudo = document.getElementById('conteudo-relatorio');
    conteudo.innerHTML = `
        <h3 style="color:#d4af37;margin-bottom:20px">Relatório — ${local}</h3>
        <div class="resultado ${interpretacao.classe}">
            <div class="valor-I">I = ${resultado.I}</div>
            <h4 style="text-align:center;margin-bottom:15px">${interpretacao.titulo}</h4>
            <p style="text-align:center">${interpretacao.texto}</p>
        </div>
        <div style="margin-top:25px">
            <h4 style="color:#d4af37">📊 Dados do Padrão</h4>
            <p>Padrão Estrutural: ${Math.round(resultado.PE)}/100</p>
            <p>Chuva esperada: ${dados.chuva} mm/mês</p>
            <p>Temperatura: ${dados.tempMin}°C a ${dados.tempMax}°C</p>
            <p>Umidade: ${dados.umidade}%</p>
        </div>
    `;

    document.getElementById('relatorio').style.display = 'block';
    document.getElementById('relatorio').scrollIntoView({behavior:'smooth'});
}
</script>

</body>
</html>
